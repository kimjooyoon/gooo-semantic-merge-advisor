name: One-time format

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to format
        required: true
        type: string

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: gofmt -w $(git ls-files '*.go')
      - name: Push formatted sources
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $(git ls-files '*.go')
          git commit -m 'ci: apply Go formatting'
          git push origin "HEAD:${{ inputs.target_branch }}"
